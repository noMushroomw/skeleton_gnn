run_dir: runs
run_name: amass_ablation
seed: 0
batch_size: 32
max_steps: 4000
lr: 3.0e-4
min_lr_ratio: 0.05
weight_decay: 0.01
betas: [0.9, 0.95]
warmup_steps: 200
grad_clip: 1.0
ema_decay: 0.999
amp_dtype: bfloat16
num_workers: 0

log_every: 50
eval_every: 500
save_every: 2000
eval_batches: 8
eval_num_samples: 5
eval_num_steps: 10

model_preset: small_full
model: {}

flow:
  sigma_dir: 0.9

data:
  path: data/data_3d_amass.npz
  obs_length: 30
  pred_length: 120
  stride: 30
  fps: 60
  augment_mirror: true
