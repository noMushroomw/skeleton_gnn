run_dir: runs
run_name: h36m_deep

seed: 0
batch_size: 64
max_steps: 40000
lr: 2.0e-4
min_lr_ratio: 0.02
weight_decay: 0.01
betas: [0.9, 0.95]
warmup_steps: 1000
grad_clip: 1.0
ema_decay: 0.999
amp_dtype: bfloat16
num_workers: 3

log_every: 100
eval_every: 1000
save_every: 5000
eval_batches: 4
eval_num_samples: 20
eval_num_steps: 10

model_preset: base_adaln_single_deep
model: {}

flow:
  sigma_dir: 0.9
  source_mode: white
  common_scale: 0.0
  fk_metric_alpha: 0.0

data:
  path: data/data_3d_h36m_17.npz
  obs_length: 30
  pred_length: 120
  stride: 30
  fps: 60
  source_fps: 50
  subjects: [S1, S5, S6, S7]
  augment_mirror: false

data_valid:
  subjects: [S8]
